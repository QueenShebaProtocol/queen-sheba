<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Queen Sheba Luxury Royal E-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060504;
      --bg-surface: #0e0c0a;
      --bg-card: rgba(18, 14, 11, 0.88);
      --bg-card-border: rgba(212, 175, 55, 0.4);
      --bg-input: #0f0d0b;
      --border-input: #2f251d;
      
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
      --gold-btn-hover: linear-gradient(135deg, #e5c158 0%, #fff0be 50%, #bd8d1a 100%);
      
      --text-main: #f5eedc;
      --text-muted: #9c8e7b;
      --text-dim: #6b6051;
      
      --accent-red: #e04848;
      --accent-amber: #e5a93b;
      --accent-green: #2ecc71;
      
      --font-display: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Ethiopian Geometric Pattern Overlay */
    .pattern-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(rgba(212, 175, 55, 0.07) 1px, transparent 1px),
        linear-gradient(45deg, rgba(212, 175, 55, 0.025) 25%, transparent 25%, transparent 75%, rgba(212, 175, 55, 0.025) 75%),
        linear-gradient(45deg, rgba(212, 175, 55, 0.025) 25%, transparent 25%, transparent 75%, rgba(212, 175, 55, 0.025) 75%);
      background-size: 40px 40px, 64px 64px, 64px 64px;
      background-position: 0 0, 0 0, 32px 32px;
      pointer-events: none;
      opacity: 0.7;
      z-index: 0;
    }

    /* Top Warning Banner */
    .top-warning-banner {
      background: #150a00;
      border-bottom: 1px solid rgba(229, 169, 59, 0.4);
      color: #f7b731;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }

    /* Main Container */
    .signup-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 5;
    }

    .signup-content-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      max-width: 1200px;
      width: 100%;
    }

    /* Left Ethiopian Side Diamonds Decor */
    .side-diamond-decor {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      color: rgba(212, 175, 55, 0.4);
      font-size: 1.6rem;
    }

    /* Card Styling (Exact Match) */
    .signup-card {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(180deg, rgba(24, 18, 14, 0.94) 0%, rgba(13, 10, 8, 0.98) 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 20px;
      padding: 38px 36px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(212, 175, 55, 0.08),
        inset 0 1px 2px rgba(243, 229, 171, 0.3);
      position: relative;
    }

    .card-top-ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: var(--gold-primary);
      margin-bottom: 12px;
      font-size: 0.8rem;
    }

    .card-brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-crown-logo {
      width: 44px;
      height: 44px;
      fill: var(--gold-primary);
      margin: 0 auto 8px auto;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.5));
    }

    .card-brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #f7eedd;
    }

    .card-brand-subdivider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(212, 175, 55, 0.6);
      font-size: 0.7rem;
      margin-top: 4px;
    }

    .card-brand-subdivider::before,
    .card-brand-subdivider::after {
      content: '';
      width: 32px;
      height: 1px;
      background: rgba(212, 175, 55, 0.4);
    }

    .card-page-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-top: 14px;
      letter-spacing: 0.02em;
    }

    .card-page-desc {
      text-align: center;
      font-size: 0.86rem;
      color: #9c8e7c;
      margin-top: 4px;
      margin-bottom: 22px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #d6ccbe;
      margin-bottom: 6px;
    }

    .input-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field-icon {
      position: absolute;
      left: 14px;
      color: var(--gold-primary);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .input-text-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 8px;
      padding: 12px 42px 12px 42px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-text-field:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .input-toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .input-toggle-password:hover {
      color: var(--gold-light);
    }

    .form-row-terms {
      margin-top: 14px;
      margin-bottom: 22px;
      font-size: 0.82rem;
    }

    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: #aca08f;
      cursor: pointer;
      line-height: 1.4;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--gold-primary);
      width: 16px;
      height: 16px;
      margin-top: 2px;
      cursor: pointer;
    }

    .checkbox-label a {
      color: #e5b958;
      text-decoration: none;
    }

    .checkbox-label a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .btn-submit-gold {
      width: 100%;
      background: var(--gold-gradient);
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      color: #1a1208;
      font-family: var(--font-sans);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .btn-submit-gold:hover {
      background: var(--gold-btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(212, 175, 55, 0.45);
    }

    .btn-crown-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Divider "OR" */
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0;
      color: #7d705f;
      font-size: 0.76rem;
      letter-spacing: 0.1em;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #2d241d;
    }

    .or-divider span {
      padding: 0 14px;
    }

    /* Switch to Sign In */
    .auth-switch-text {
      text-align: center;
      font-size: 0.88rem;
      color: #a89c8b;
    }

    .auth-switch-link {
      color: #f0c355;
      text-decoration: none;
      font-weight: 600;
      margin-left: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .auth-switch-link:hover {
      color: #ffffff;
    }

    /* Right Queen Image Portrait */
    .queen-portrait-wrapper {
      position: relative;
      max-width: 480px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
    }

    .queen-portrait-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .queen-portrait-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 60px 30px #060504;
      pointer-events: none;
    }

    /* Bottom 4 Features Strip (matches Sign_up.png) */
    .bottom-features-bar {
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      background: #080605;
      padding: 18px 48px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      z-index: 10;
    }

    .bottom-feat-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .bottom-feat-icon {
      color: var(--gold-primary);
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .bottom-feat-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ede2d2;
    }

    .bottom-feat-sub {
      font-size: 0.74rem;
      color: #7a7061;
    }

    /* Error & Success Messages */
    .alert-error {
      background: rgba(224, 72, 72, 0.15);
      border: 1px solid var(--accent-red);
      color: #ff9b9b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert-success {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid var(--accent-green);
      color: #7bed9f;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 1080px) {
      .queen-portrait-wrapper {
        display: none;
      }
      .side-diamond-decor {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .bottom-features-bar {
        grid-template-columns: repeat(2, 1fr);
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="pattern-overlay"></div>

  <!-- Top Alert Banner -->
  <div class="top-warning-banner">
    <span>⚠️</span>
    <span>AI DEMO ENVIRONMENT – INTENTIONALLY VULNERABLE</span>
  </div>

  <div class="signup-wrapper">
    <div class="signup-content-layout">

      <!-- Left Decorative Ethiopian Motif -->
      <div class="side-diamond-decor">
        <span>❖</span>
        <span>◈</span>
        <span>❖</span>
      </div>

      <!-- Center Sign Up Card -->
      <div class="signup-card">
        <div class="card-top-ornament">
          <span>◇</span><span>◆</span><span>◇</span>
        </div>

        <div class="card-brand-header">
          <svg class="card-crown-logo" viewBox="0 0 24 24">
            <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z" />
          </svg>
          <div class="card-brand-title">QUEEN SHEBA</div>
          <div class="card-brand-subdivider">
            <span>◇</span>
          </div>
          <h1 class="card-page-title">Create Your Account</h1>
          <p class="card-page-desc">Join the Queen Sheba experience</p>
        </div>

        <div id="signup-error-msg" class="alert-error"></div>
        <div id="signup-success-msg" class="alert-success"></div>

        <form id="signup-form">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <div class="input-icon-wrap">
              <svg class="input-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="signup-name" class="input-text-field" placeholder="Full Name" required autofocus>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <div class="input-icon-wrap">
              <svg class="input-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="signup-email" class="input-text-field" placeholder="Email Address" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="input-icon-wrap">
              <svg class="input-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="signup-password" class="input-text-field" placeholder="Password" required minlength="6">
              <button type="button" class="input-toggle-password" onclick="togglePasswordVisibility('signup-password')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm Password</label>
            <div class="input-icon-wrap">
              <svg class="input-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="signup-confirm-password" class="input-text-field" placeholder="Confirm Password" required minlength="6">
              <button type="button" class="input-toggle-password" onclick="togglePasswordVisibility('signup-confirm-password')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-row-terms">
            <label class="checkbox-label">
              <input type="checkbox" id="agree-terms" required>
              <span>I agree to the <a href="javascript:void(0)" onclick="alert('Demo Terms: Fictional store environment for testing purposes.')">Terms and Conditions</a> and <a href="javascript:void(0)" onclick="alert('Demo Privacy: No personal data is harvested or retained permanently.')">Privacy Policy</a>.</span>
            </label>
          </div>

          <button type="submit" id="btn-signup-submit" class="btn-submit-gold">
            <svg class="btn-crown-icon" viewBox="0 0 24 24">
              <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z" />
            </svg>
            <span>Create Account</span>
          </button>

          <div class="or-divider">
            <span>OR</span>
          </div>

          <div class="auth-switch-text">
            Already have an account?
            <a href="/login" class="auth-switch-link">Sign In →</a>
          </div>
        </form>
      </div>

      <!-- Right Column: Royal Queen Sheba Portrait -->
      <div class="queen-portrait-wrapper">
        <img src="/images/log_in_qeen_logo.png" alt="Queen Sheba Royal Portrait" class="queen-portrait-img">
        <div class="queen-portrait-vignette"></div>
      </div>

    </div>
  </div>

  <!-- Bottom 4 Feature Items (Exact match from Sign_up.png) -->
  <footer class="bottom-features-bar">
    <div class="bottom-feat-item">
      <svg class="bottom-feat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <div>
        <div class="bottom-feat-title">Secure Payments</div>
        <div class="bottom-feat-sub">100% Protected</div>
      </div>
    </div>

    <div class="bottom-feat-item">
      <svg class="bottom-feat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="3" width="15" height="13"></rect>
        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
        <circle cx="5.5" cy="18.5" r="2.5"></circle>
        <circle cx="18.5" cy="18.5" r="2.5"></circle>
      </svg>
      <div>
        <div class="bottom-feat-title">Fast Delivery</div>
        <div class="bottom-feat-sub">Across Ethiopia</div>
      </div>
    </div>

    <div class="bottom-feat-item">
      <svg class="bottom-feat-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z" />
      </svg>
      <div>
        <div class="bottom-feat-title">Royal Service</div>
        <div class="bottom-feat-sub">Here to help</div>
      </div>
    </div>

    <div class="bottom-feat-item">
      <svg class="bottom-feat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="8" r="7"></circle>
        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
      </svg>
      <div>
        <div class="bottom-feat-title">Premium Quality</div>
        <div class="bottom-feat-sub">Top tier products</div>
      </div>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm_password = document.getElementById('signup-confirm-password').value;
      const agree = document.getElementById('agree-terms').checked;

      const errorBox = document.getElementById('signup-error-msg');
      const successBox = document.getElementById('signup-success-msg');
      const submitBtn = document.getElementById('btn-signup-submit');

      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      if (!agree) {
        errorBox.textContent = 'Please agree to the Terms and Conditions.';
        errorBox.style.display = 'block';
        return;
      }

      if (password !== confirm_password) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Creating Account...';

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirm_password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Sign up failed.');
        }

        successBox.textContent = 'Account created successfully! Redirecting to sign in...';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg class="btn-crown-icon" viewBox="0 0 24 24">
            <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z" />
          </svg>
          <span>Create Account</span>
        `;
      }
    });
  </script>
</body>
</html>
