<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Queen Sheba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #060504;
      --bg-card: #120e0b;
      --border-color: #271e16;
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
      --text-main: #f5eedc;
      --text-muted: #9c8e7c;
      --font-display: 'Cinzel', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-warning-banner {
      background: #140902;
      border-bottom: 1px solid rgba(229, 169, 59, 0.35);
      color: #f7b731;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 48px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      background: rgba(6, 5, 4, 0.92);
      backdrop-filter: blur(12px);
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--gold-primary);
    }

    .brand-crown-svg {
      width: 28px;
      height: 28px;
      fill: var(--gold-primary);
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #f5eedc;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-link {
      color: #c5b9a8;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .nav-link:hover {
      color: var(--gold-primary);
    }

    .account-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      padding: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      font-size: 1.8rem;
    }

    .user-greeting {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: #ffffff;
    }

    .user-email-text {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .user-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--gold-light);
    }

    .profile-actions {
      display: flex;
      gap: 12px;
    }

    .btn-gold {
      background: var(--gold-gradient);
      border: none;
      color: #120e0b;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #3d2d22;
      color: #b5a897;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
    }

    .btn-outline:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .orders-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
    }

    .orders-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: #f7eedd;
      margin-bottom: 18px;
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .orders-table th {
      text-align: left;
      padding: 10px 12px;
      color: #8c8070;
      border-bottom: 1px solid var(--border-color);
    }

    .orders-table td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(39, 30, 22, 0.6);
      color: #e5ded3;
    }

    .order-id-gold {
      color: #e5b958;
      font-weight: 700;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .status-pill.shipped { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .status-pill.processing { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .status-pill.delivered { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

    .empty-orders {
      padding: 30px;
      text-align: center;
      color: #8c8070;
    }
  </style>
</head>
<body>

  <!-- Top Warning Banner -->
  <div class="top-warning-banner">
    <span>⚠️</span>
    <span>AI DEMO ENVIRONMENT – INTENTIONALLY VULNERABLE</span>
  </div>

  <header class="site-header">
    <a href="/" class="brand-logo-wrap">
      <svg class="brand-crown-svg" viewBox="0 0 24 24">
        <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14v2H5v-2z" />
      </svg>
      <span class="brand-name">QUEEN SHEBA</span>
    </a>

    <nav class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/products" class="nav-link">Products</a>
      <a href="/assistant" class="nav-link">AI Assistant</a>
      <a href="/about" class="nav-link">About Us</a>
      <a href="/admin" id="admin-nav-link" class="nav-link" style="display: none; color: #f59e0b; font-weight: 700;">Admin Panel ↗</a>
    </nav>
  </header>

  <main class="account-container">
    <div class="profile-card">
      <div class="profile-left">
        <div class="avatar-circle">👑</div>
        <div>
          <h1 class="user-greeting" id="user-display-name">Welcome</h1>
          <div class="user-email-text" id="user-display-email">Loading account...</div>
          <div class="user-badge" id="user-role-badge">Customer Account</div>
        </div>
      </div>

      <div class="profile-actions">
        <a href="/assistant" class="btn-gold">
          <span>💬 Open Queen AI</span>
        </a>
        <button class="btn-outline" onclick="Auth.logout()">Sign Out</button>
      </div>
    </div>

    <div class="orders-section">
      <h2 class="orders-title">Your Order History</h2>
      <table class="orders-table">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Product</th>
            <th>Total Amount</th>
            <th>Order Date</th>
            <th>Tracking / Carrier</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="user-orders-tbody">
          <tr>
            <td colspan="6" class="empty-orders">Loading your orders...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    if (!Auth.requireAuth()) {
      // redirected
    }

    const user = Auth.getUser();
    if (user) {
      document.getElementById('user-display-name').textContent = `Welcome, ${user.name}`;
      document.getElementById('user-display-email').textContent = `Email: ${user.email}`;
      document.getElementById('user-role-badge').textContent = `Account Type: ${user.role === 'admin' ? 'Administrator' : 'Customer'}`;
      if (user.role === 'admin') {
        document.getElementById('admin-nav-link').style.display = 'block';
      }
    }

    async function loadUserOrders() {
      try {
        const res = await Auth.authFetch('/api/user/orders');
        if (!res.ok) return;
        const orders = await res.json();
        const tbody = document.getElementById('user-orders-tbody');
        if (!orders || orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-orders">No orders found for this account.</td></tr>';
          return;
        }

        tbody.innerHTML = orders.map(o => `
          <tr>
            <td class="order-id-gold">${o.order_id}</td>
            <td style="font-weight: 600;">${o.product_name}</td>
            <td style="font-weight: 600;">$${parseFloat(o.total_amount).toFixed(2)}</td>
            <td>${o.order_date}</td>
            <td style="font-size: 0.8rem; color: #9c8e7c;">${o.tracking_number || 'N/A'}<br><span style="font-size: 0.72rem; color: #6e6150;">${o.carrier || ''}</span></td>
            <td><span class="status-pill ${o.status.toLowerCase()}">${o.status}</span></td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    loadUserOrders();
  </script>
</body>
</html>
